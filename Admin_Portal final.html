<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Retirement Plan Karo – Admin Portal</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #f5f6fa;
                --card: #fff;
                --ink: #14172b;
                --mut: #697089;
                --line: #e6e8f0;
                --pri: #4f46e5;
                --pri-s: #ecebff;
                --ok: #0f7a3d;
                --ok-s: #dcf6e6;
                --bad: #a4161a;
                --bad-s: #fde2e2;
                --warn: #8a5a00;
                --warn-s: #fdf0cf;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #0f1220;
                    --card: #181c30;
                    --ink: #eceefb;
                    --mut: #9aa1bf;
                    --line: #2a2f4a;
                    --pri: #8b85ff;
                    --pri-s: #26275a;
                    --ok: #6fe0a0;
                    --ok-s: #133a28;
                    --bad: #ff9a9d;
                    --bad-s: #4a1a1d;
                    --warn: #f3c460;
                    --warn-s: #3d3012;
                }
            }
            :root[data-theme="dark"] {
                --bg: #0f1220;
                --card: #181c30;
                --ink: #eceefb;
                --mut: #9aa1bf;
                --line: #2a2f4a;
                --pri: #8b85ff;
                --pri-s: #26275a;
                --ok: #6fe0a0;
                --ok-s: #133a28;
                --bad: #ff9a9d;
                --bad-s: #4a1a1d;
                --warn: #f3c460;
                --warn-s: #3d3012;
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font:
                    14px/1.5 "Plus Jakarta Sans",
                    system-ui,
                    sans-serif;
                display: flex;
                min-height: 100vh;
            }
            nav {
                width: 224px;
                flex: none;
                background: var(--card);
                border-right: 1px solid var(--line);
                padding: 18px 12px;
                position: sticky;
                top: 0;
                height: 100vh;
                overflow: auto;
            }
            nav h1 {
                font-size: 16px;
                margin: 0 8px 2px;
            }
            nav small {
                display: block;
                margin: 0 8px 14px;
                color: var(--mut);
            }
            nav a {
                display: block;
                padding: 8px 10px;
                border-radius: 8px;
                color: var(--mut);
                cursor: pointer;
                font-weight: 500;
            }
            nav a:hover {
                background: var(--bg);
            }
            nav a.on {
                background: var(--pri-s);
                color: var(--pri);
                font-weight: 700;
            }
            main {
                flex: 1;
                min-width: 0;
                padding: 22px 26px 60px;
            }
            h2 {
                font-size: 21px;
                margin: 0 0 14px;
            }
            .kpis {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 10px;
                margin-bottom: 16px;
            }
            .k {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 12px 14px;
            }
            .k span {
                color: var(--mut);
                font-size: 12.5px;
            }
            .k b {
                display: block;
                font-size: 21px;
            }
            .pick {
                display: flex;
                gap: 10px;
                margin-bottom: 16px;
                flex-wrap: wrap;
            }
            .pick select,
            .pick input {
                font: inherit;
                padding: 10px 12px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--card);
                color: var(--ink);
                min-width: 0;
            }
            .pick select {
                flex: 1;
                min-width: 260px;
                font-weight: 600;
            }
            .pick input {
                width: 230px;
            }
            .hd {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 16px 18px;
                margin-bottom: 14px;
                display: flex;
                gap: 16px;
                align-items: center;
                flex-wrap: wrap;
            }
            .av {
                width: 52px;
                height: 52px;
                border-radius: 50%;
                background: var(--pri);
                color: #fff;
                display: grid;
                place-items: center;
                font-weight: 700;
                font-size: 18px;
            }
            .hd h3 {
                margin: 0;
                font-size: 18px;
            }
            .hd p {
                margin: 0;
                color: var(--mut);
            }
            .hd .r {
                margin-left: auto;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            .btn {
                font: inherit;
                font-weight: 600;
                padding: 7px 12px;
                border-radius: 8px;
                border: 1px solid var(--line);
                background: var(--card);
                color: var(--ink);
                cursor: pointer;
            }
            .btn.p {
                background: var(--pri);
                color: #fff;
                border-color: var(--pri);
            }
            .btn.d {
                color: var(--bad);
            }
            .tabs {
                display: flex;
                gap: 6px;
                margin-bottom: 14px;
                flex-wrap: wrap;
                position: sticky;
                top: 0;
                background: var(--bg);
                padding: 6px 0;
                z-index: 5;
            }
            .tabs button {
                font: inherit;
                font-weight: 600;
                border: 1px solid var(--line);
                background: var(--card);
                color: var(--mut);
                padding: 6px 13px;
                border-radius: 99px;
                cursor: pointer;
            }
            .tabs button.on {
                background: var(--pri);
                color: #fff;
                border-color: var(--pri);
            }
            .card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                margin-bottom: 14px;
                overflow: hidden;
            }
            .card > h3 {
                margin: 0;
                padding: 12px 16px;
                font-size: 14.5px;
                border-bottom: 1px solid var(--line);
            }
            .kv {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                margin: 0;
            }
            .kv div {
                padding: 10px 16px;
                border-bottom: 1px solid var(--line);
            }
            .kv dt {
                color: var(--mut);
                font-size: 12.5px;
            }
            .kv dd {
                margin: 0;
                font-weight: 600;
                word-break: break-word;
            }
            .sc {
                overflow-x: auto;
            }
            table {
                border-collapse: collapse;
                width: 100%;
                min-width: 560px;
            }
            th,
            td {
                text-align: left;
                padding: 9px 14px;
                border-bottom: 1px solid var(--line);
                white-space: nowrap;
            }
            th {
                color: var(--mut);
                font-size: 12.5px;
                font-weight: 600;
                background: color-mix(in srgb, var(--bg) 60%, var(--card));
            }
            tr:last-child td {
                border: 0;
            }
            tr.c {
                cursor: pointer;
            }
            tr.c:hover {
                background: var(--pri-s);
            }
            .pill {
                display: inline-block;
                padding: 2px 9px;
                border-radius: 99px;
                font-size: 12px;
                font-weight: 700;
                background: var(--bg);
                color: var(--mut);
            }
            .pill.ok {
                background: var(--ok-s);
                color: var(--ok);
            }
            .pill.bad {
                background: var(--bad-s);
                color: var(--bad);
            }
            .pill.warn {
                background: var(--warn-s);
                color: var(--warn);
            }
            .pill.pri {
                background: var(--pri-s);
                color: var(--pri);
            }
            .em {
                padding: 16px;
                color: var(--mut);
            }
            .tl {
                border-left: 2px solid var(--line);
                margin: 14px 16px 8px 22px;
                padding-left: 18px;
            }
            .tl div {
                position: relative;
                padding-bottom: 12px;
            }
            .tl div:before {
                content: "";
                position: absolute;
                left: -25px;
                top: 6px;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--pri);
            }
            .tl small {
                color: var(--mut);
                display: block;
            }
            .bar {
                display: flex;
                gap: 8px;
                padding: 12px 16px;
                border-bottom: 1px solid var(--line);
            }
            .bar input {
                font: inherit;
                padding: 7px 10px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--bg);
                color: var(--ink);
                flex: 1;
                max-width: 320px;
            }
            .ov {
                position: fixed;
                inset: 0;
                background: rgba(10, 12, 30, 0.5);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 50;
                padding: 16px;
            }
            .ov.o {
                display: flex;
            }
            .mo {
                background: var(--card);
                border-radius: 14px;
                width: min(560px, 100%);
                max-height: 90vh;
                overflow: auto;
                padding: 20px;
            }
            .mo h3 {
                margin: 0 0 12px;
            }
            .fg {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .fg label {
                display: block;
                font-size: 12.5px;
                color: var(--mut);
                font-weight: 600;
            }
            .fg .w {
                grid-column: 1/-1;
            }
            .fg input,
            .fg select,
            .fg textarea,
            .in {
                font: inherit;
                width: 100%;
                margin-top: 3px;
                padding: 8px 10px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--bg);
                color: var(--ink);
            }
            .fg input[type="checkbox"] {
                width: auto;
            }
            .mo .ac {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
                margin-top: 14px;
            }
            .tt {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--ink);
                color: var(--bg);
                padding: 10px 16px;
                border-radius: 10px;
                z-index: 60;
                display: none;
                font-weight: 600;
            }
            .tt.o {
                display: block;
            }
            .row {
                display: flex;
                gap: 6px;
            }
            .btn.s {
                padding: 4px 9px;
                font-size: 12.5px;
            }
            .pg {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
                gap: 12px;
                padding: 16px;
            }
            .pg label {
                font-size: 12.5px;
                color: var(--mut);
                font-weight: 600;
            }
            @media (max-width: 800px) {
                body {
                    display: block;
                }
                nav {
                    position: static;
                    width: auto;
                    height: auto;
                    display: flex;
                    gap: 4px;
                    overflow-x: auto;
                    padding: 8px;
                }
                nav h1,
                nav small {
                    display: none;
                }
                nav a {
                    white-space: nowrap;
                }
                main {
                    padding: 14px;
                }
                .hd .r {
                    margin-left: 0;
                }
            }
            @media print {
                nav,
                .pick,
                .tabs,
                .hd .r {
                    display: none;
                }
                body {
                    display: block;
                }
            }
            .btn.wa {
                background: #25d366;
                color: #053b1b;
                border-color: #25d366;
            }
            .pick label {
                font-size: 12.5px;
                color: var(--mut);
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .pick input[type="date"] {
                width: auto;
            }
            .k[data-a]:hover {
                border-color: var(--pri);
            }
            .mo {
                width: min(860px, 100%);
            }
            .mo textarea {
                min-height: 200px;
                line-height: 1.6;
                font-size: 14px;
            }
            .mo .tabs button {
                padding: 6px 16px;
            }
            .mh {
                display: flex;
                gap: 10px;
                align-items: center;
                margin-bottom: 12px;
            }
            .mh h3 {
                margin: 0;
            }
            .tbs {
                display: flex;
                gap: 6px;
                margin-bottom: 12px;
                flex-wrap: wrap;
            }
            .tbs button {
                font: inherit;
                font-weight: 600;
                border: 1px solid var(--line);
                background: var(--card);
                color: var(--mut);
                padding: 6px 14px;
                border-radius: 99px;
                cursor: pointer;
            }
            .tbs button.on {
                background: var(--pri);
                color: #fff;
                border-color: var(--pri);
            }
            .tg {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
                gap: 8px;
                max-height: 50vh;
                overflow: auto;
                margin-bottom: 12px;
            }
            .tc {
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 9px 12px;
                cursor: pointer;
            }
            .tc:hover,
            .tc.rec {
                border-color: var(--pri);
                background: var(--pri-s);
            }
            .tc small {
                display: block;
                color: var(--mut);
                margin-top: 3px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .tp {
                display: grid;
                grid-template-columns: 300px 1fr;
                gap: 12px;
            }
            .tl2 {
                max-height: 62vh;
                overflow: auto;
            }
            .tli {
                padding: 9px 14px;
                border-bottom: 1px solid var(--line);
                cursor: pointer;
            }
            .tli small {
                display: block;
                color: var(--mut);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .tli.on,
            .tli:hover {
                background: var(--pri-s);
            }
            .mo {
                max-height: 94vh;
            }
            @media (max-width: 800px) {
                .tp {
                    grid-template-columns: 1fr;
                }
            }
            /* ===== v6: simplified nav, menus, bulk send ===== */
            nav .ng {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                color: var(--mut);
                opacity: 0.8;
                margin: 16px 10px 4px;
            }
            nav .ng:first-of-type {
                margin-top: 4px;
            }
            nav a .pill {
                margin-left: 6px;
            }
            .btn[disabled] {
                opacity: 0.45;
                cursor: not-allowed;
            }
            .btn.lg {
                padding: 11px 20px;
                font-size: 15px;
                border-radius: 10px;
            }
            .btn.link {
                border: 0;
                background: none;
                color: var(--pri);
                padding: 4px 6px;
                font-weight: 600;
            }
            .dd {
                position: relative;
                display: inline-block;
            }
            .dd > summary {
                list-style: none;
                cursor: pointer;
                user-select: none;
            }
            .dd > summary::-webkit-details-marker {
                display: none;
            }
            .dd .ddm {
                position: absolute;
                right: 0;
                top: calc(100% + 4px);
                min-width: 220px;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 10px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
                padding: 4px;
                z-index: 70;
                display: flex;
                flex-direction: column;
            }
            .dd .mi {
                font: inherit;
                font-weight: 600;
                text-align: left;
                background: none;
                border: 0;
                border-radius: 7px;
                padding: 9px 12px;
                color: var(--ink);
                cursor: pointer;
                white-space: nowrap;
            }
            .dd .mi:hover {
                background: var(--pri-s);
            }
            .dd .mi.d {
                color: var(--bad);
            }
            .dd > summary.btn.s {
                padding: 4px 10px;
            }
            .ms-sec {
                padding: 16px;
                border-bottom: 1px solid var(--line);
            }
            .ms-sec:last-child {
                border: 0;
            }
            .ms-h {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 700;
                font-size: 14.5px;
                margin-bottom: 10px;
            }
            .ms-h i {
                font-style: normal;
                width: 24px;
                height: 24px;
                border-radius: 50%;
                background: var(--pri);
                color: #fff;
                display: grid;
                place-items: center;
                font-size: 12.5px;
            }
            .ms-h small {
                font-weight: 500;
                color: var(--mut);
            }
            .ms-row {
                display: flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;
            }
            .ms-sec select,
            .ms-sec input[type="text"],
            .ms-sec textarea {
                font: inherit;
                width: 100%;
                padding: 9px 11px;
                border: 1px solid var(--line);
                border-radius: 9px;
                background: var(--bg);
                color: var(--ink);
            }
            .ms-sec select {
                width: auto;
                min-width: 240px;
                font-weight: 600;
            }
            .ms-sec textarea {
                line-height: 1.55;
                resize: vertical;
            }
            .ms-list {
                max-height: 270px;
                overflow: auto;
                border: 1px solid var(--line);
                border-radius: 10px;
                margin-top: 10px;
            }
            .ms-list table {
                min-width: 0;
            }
            .ms-list td,
            .ms-list th {
                padding: 7px 12px;
            }
            .ms-list th {
                position: sticky;
                top: 0;
            }
            .ms-list th:first-child,
            .ms-list td:first-child {
                width: 34px;
                padding-right: 0;
            }
            .ms-add {
                margin-top: 14px;
                padding: 12px;
                border: 1.5px dashed var(--line);
                border-radius: 10px;
                background: color-mix(in srgb, var(--pri-s) 35%, var(--card));
            }
            .ms-add b {
                display: block;
                margin-bottom: 6px;
            }
            .ms-chips {
                margin-top: 8px;
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                min-height: 4px;
            }
            .ms-bar {
                position: sticky;
                bottom: 0;
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                padding: 14px 16px;
                background: var(--card);
                border-top: 1px solid var(--line);
            }
            .ms-note {
                color: var(--mut);
                font-size: 12.5px;
                margin-top: 6px;
            }
            @media (max-width: 800px) {
                nav .ng {
                    display: none;
                }
                .ms-sec select {
                    width: 100%;
                }
            }
            /* ===== v7 ===== */
            .up {
                color: var(--ok);
            }
            .dn {
                color: var(--bad);
            }
            .cm {
                font-style: normal;
                color: var(--mut);
                font-size: 12px;
                margin-left: 6px;
            }
            nav .top,
            nav .ngh {
                font-weight: 700;
                color: var(--ink);
                margin-top: 2px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            nav .ngh.open {
                background: var(--bg);
            }
            nav .chev {
                color: var(--mut);
                font-size: 11px;
            }
            nav .nsub {
                margin-left: 14px;
                padding: 6px 10px;
                font-size: 13.5px;
                border-left: 2px solid var(--line);
                border-radius: 0 8px 8px 0;
            }
            nav .nsub.on {
                border-left-color: var(--pri);
            }
            .crumb {
                color: var(--mut);
                margin-bottom: 8px;
                font-size: 13px;
            }
            .crumb a {
                color: var(--pri);
                cursor: pointer;
                font-weight: 600;
            }
            .crumb b {
                color: var(--ink);
            }
            .stab {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                margin: 0 0 16px;
            }
            .stab a {
                padding: 6px 14px;
                border-radius: 99px;
                border: 1px solid var(--line);
                background: var(--card);
                color: var(--mut);
                font-weight: 600;
                cursor: pointer;
            }
            .stab a.on {
                background: var(--pri);
                color: #fff;
                border-color: var(--pri);
            }
            .hh {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                flex-wrap: wrap;
                align-items: flex-start;
                margin-bottom: 14px;
            }
            .hr {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                align-items: center;
            }
            .chips {
                display: flex;
                gap: 4px;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 3px;
                flex-wrap: wrap;
            }
            .chips button {
                font: inherit;
                font-weight: 600;
                border: 0;
                background: none;
                color: var(--mut);
                padding: 5px 11px;
                border-radius: 7px;
                cursor: pointer;
            }
            .chips button.on {
                background: var(--pri);
                color: #fff;
            }
            .hr input[type="date"] {
                font: inherit;
                padding: 5px 8px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--card);
                color: var(--ink);
            }
            .dg {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                gap: 12px;
                margin-bottom: 22px;
            }
            .dg .wide {
                grid-column: span 2;
            }
            @media (max-width: 560px) {
                .dg .wide {
                    grid-column: span 1;
                }
            }
            .dc {
                position: relative;

            const CC = [
                "#4F46E5",
                "#0F9D58",
                "#F59E0B",
                "#E11D48",
                "#0EA5E9",
                "#8B5CF6",
                "#14B8A6",

            const PAL = [
                ["1F4E9E", "E3ECFA"],
                ["0F7A3D", "E1F5E9"],

            function chart(kind, title, labels, vals) {
                const W = 520,
                    H = 300,
                    c = document.createElement("canvas");
                c.width = W;
                c.height = H;
                const x = c.getContext("2d");
                x.fillStyle = "#fff";
                x.fillRect(0, 0, W, H);
                x.fillStyle = "#14172b";
                x.font = "bold 16px sans-serif";
                x.fillText(title, 16, 28);
                x.font = "12px sans-serif";
                const tot = vals.reduce((a, b) => a + b, 0) || 1;
                if (kind === "donut") {
                    let a = -Math.PI / 2;
                    vals.forEach((v, i) => {
                        const d = (v / tot) * 2 * Math.PI;
                        x.beginPath();
                        x.moveTo(140, 165);
                        x.arc(140, 165, 100, a, a + d);
                        x.closePath();
                        x.fillStyle = CC[i % 8];
                        x.fill();
                        a += d;
                    });
                    x.beginPath();
                    x.arc(140, 165, 55, 0, 7);
                    x.fillStyle = "#fff";
                    x.fill();
                    labels.forEach((l, i) => {
                        x.fillStyle = CC[i % 8];
                        x.fillRect(270, 56 + i * 26, 12, 12);
                        x.fillStyle = "#14172b";
                        x.fillText(
                            String(l).slice(0, 22) +
                                " · " +
                                Math.round((vals[i] / tot) * 100) +
                                "%",
                            290,
                            67 + i * 26,
                        );
                    });
                } else {
                    const mx = Math.max(...vals, 1),
                        n = vals.length,
                        bh = Math.min(28, (H - 70) / n - 8);
                    labels.forEach((l, i) => {
                        const y = 50 + i * (bh + 10),
                            w = Math.max(2, (vals[i] / mx) * 230);
                        x.fillStyle = "#14172b";
                        x.fillText(String(l).slice(0, 24), 16, y + bh * 0.7);
                        x.fillStyle = CC[i % 8];
                        x.fillRect(170, y, w, bh);
                        x.fillStyle = "#14172b";
                        x.fillText(
                            Number(vals[i]).toLocaleString("en-IN"),
                            176 + w,
                            y + bh * 0.7,
                        );
                    });
                }
                return c.toDataURL("image/png");
            }
            async function xlsx(file, sheets) {
                if (!window.ExcelJS) {
                    toast(
                        "Excel library could not be loaded. Check your internet connection.",
                    );
                    return;
                }
                const wb = new ExcelJS.Workbook(),
                    used = {};
                const thin = { style: "thin", color: { argb: "FFCBD5E1" } },
                    bd = { top: thin, left: thin, bottom: thin, right: thin };
                sheets.forEach((s, n) => {
                    const [c, l] = PAL[n % PAL.length];
                    let nm = s.name
                        .replace(/[\\\/\?\*\[\]:]/g, "-")
                        .slice(0, 28);
                    used[nm] = (used[nm] || 0) + 1;
                    if (used[nm] > 1) nm += " " + used[nm];
                    const ws = wb.addWorksheet(nm, {
                            views: [
                                {
                                    showGridLines: false,
                                    state: "frozen",
                                    ySplit: 3,
                                },
                            ],
                        }),
                        nc = Math.max(s.head.length, 2);
                    ws.mergeCells(1, 1, 1, nc);
                    const t = ws.getCell(1, 1);
                    t.value = s.title || s.name;
                    t.font = {
                        bold: true,
                        size: 16,
                        color: { argb: "FFFFFFFF" },
                    };
                    t.fill = {
                        type: "pattern",
                        pattern: "solid",
                        fgColor: { argb: "FF" + c },
                    };
                    t.alignment = { vertical: "middle", indent: 1 };
                    ws.getRow(1).height = 32;
                    ws.mergeCells(2, 1, 2, nc);
                    const sb = ws.getCell(2, 1);
                    sb.value =
                        s.sub ||
                        "Retirement Plan Karo · " +
                            new Date().toLocaleDateString("en-IN");
                    sb.font = { italic: true, color: { argb: "FF64748B" } };
                    sb.alignment = { indent: 1 };
                    const h = ws.getRow(3);
                    h.values = s.head;
                    h.height = 24;
                    h.eachCell((k) => {
                        k.fill = {
                            type: "pattern",
                            pattern: "solid",
                            fgColor: { argb: "FF" + c },
                        };
                        k.font = { bold: true, color: { argb: "FFFFFFFF" } };
                        k.border = bd;
                        k.alignment = {
                            vertical: "middle",
                            horizontal: "center",
                        };
                    });
                    s.rows.forEach((r, i) => {
                        const row = ws.addRow(r);
                        row.height = 20;
                        for (let ci = 1; ci <= nc; ci++) {
                            const k = row.getCell(ci);
                            k.border = bd;
                            k.alignment = {
                                vertical: "middle",
                                wrapText: true,
                            };
                            k.fill = {
                                type: "pattern",
                                pattern: "solid",
                                fgColor: {
                                    argb: i % 2 ? "FFFFFFFF" : "FF" + l,
                                },
                            };
                            if (typeof k.value === "number" && k.value >= 1000)
                                k.numFmt = "#,##0";
                        }
                    });
                    if (!s.rows.length) {
                        ws.addRow(["No records"]);
                    }
                    s.head.forEach((x, ci) => {
                        ws.getColumn(ci + 1).width = Math.min(
                            50,
                            Math.max(
                                String(x).length + 4,
                                ...s.rows.map(
                                    (r) => String(r[ci] ?? "").length + 3,
                                ),
                            ),
                        );
                    });
                    ws.autoFilter = {
                        from: { row: 3, column: 1 },
                        to: { row: 3, column: nc },
                    };
                    (s.charts || []).forEach((g, k) => {
                        const id = wb.addImage({ base64: g, extension: "png" });
                        ws.addImage(id, {
                            tl: { col: nc + 1, row: 2 + k * 16 },
                            ext: { width: 520, height: 300 },
                        });
                    });
                });
                const buf = await wb.xlsx.writeBuffer(),
                    a = document.createElement("a");
                a.href = URL.createObjectURL(
                    new Blob([buf], {
                        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                    }),
                );
                a.download = file;
                a.click();
                toast("Excel downloaded");
            }

                    ws.mergeCells(2, 1, 2, nc);
                    k = ws.getCell(2, 1);

                    k.font = {
                        bold: true,
                        size: 20,

                    };
                    k.fill = fl(c);
                    k.alignment = { indent: 1, vertical: "middle" };

                    ws.mergeCells(3, 1, 3, nc);
                    k = ws.getCell(3, 1);

                        (s.sub || "") +

                        italic: true,
                        size: 10,
                        color: { argb: "FF64748B" },
                    };
                    k.fill = fl(l);
                    k.alignment = { indent: 1, vertical: "middle" };
                    ws.getRow(3).height = 20;
                    const h = ws.getRow(4);
                    h.values = s.head;
                    h.height = 26;
                    h.eachCell((x) => {
                        x.fill = fl("1E293B");
                        x.font = { bold: true, color: { argb: "FFFFFFFF" } };
                        x.border = {
                            ...bd,
                            bottom: {
                                style: "medium",

                        };
                        x.alignment = {
                            vertical: "middle",

                        };
                    });
                    const money = s.head.map(

                            /₹|amount|value|income|price|balance|revenue|bonus|cover|premium/i.test(
                                String(x),
                            ) && !/status|id$/i.test(String(x)),
                    );
                    s.rows.forEach((r, i) => {
                        const row = ws.addRow(r),
                            ln = Math.max(
                                1,
                                ...r.map((v) => {
                                    const t = String(v ?? "");
                                    return (
                                        Math.ceil(t.length / 55) +
                                        (t.split("\n").length - 1)
                                    );
                                }),
                            );
                        row.height = Math.max(21, ln * 15);
                        for (let ci = 1; ci <= nc; ci++) {

                                x.alignment = {
                                    vertical: "middle",
                                    horizontal: "right",
                                };

                                        bold: true,

            /* ---- bulk send: contacts ---- */
            const normMob = (s) => {
                let d = String(s).replace(/\D/g, "");
                if (d.length === 12 && d.startsWith("91")) d = d.slice(2);
                else if (d.length === 11 && d[0] === "0") d = d.slice(1);
                return /^[6-9]\d{9}$/.test(d) ? d : null;
            };
            const isMail = (s) => /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]{2,}$/.test(s);
            const msParse = (raw) => {
                const mob = [],
                    mail = [],
                    bad = [];
                String(raw || "")
                    .split(/[\n,;]+/)
                    .map((x) => x.trim())
                    .filter(Boolean)
                    .forEach((p) => {
                        if (p.includes("@")) {
                            p.split(/\s+/).forEach((t) =>
                                isMail(t)
                                    ? mail.push(t.toLowerCase())
                                    : bad.push(t),
                            );
                        } else {
                            const t = p.split(/\s+/);
                            if (t.length > 1 && t.every((x) => normMob(x)))
                                t.forEach((x) => mob.push(normMob(x)));
                            else {
                                const n = normMob(p);
                                n ? mob.push(n) : bad.push(p);
                            }
                        }
                    });
                return { mob, mail, bad };
            };
            const msKey = (r) =>

                (MS.ch === "wa" ? r.mobile : r.email.toLowerCase());

                MS.seg === "__fixed" && MS.fixed
                    ? U.filter((u) => MS.fixed.includes(u.id))

                          ? U.filter((u) => leadStage(u) === MS.seg.slice(8))
                          : U;
            function msRecips() {
                const wa = MS.ch === "wa",
                    seen = new Set(),
                    list = [],
                    rows = [];
                let miss = 0,
                    dup = 0;
                msBase().forEach((u) => {
                    const c = wa
                        ? normMob(u.mobile)
                        : isMail(u.email || "")
                          ? u.email.toLowerCase()
                          : null;
                    const r = {
                        u,
                        name: u.name,
                        mobile: normMob(u.mobile) || u.mobile,
                        email: u.email || "",
                        c,
                        off: MS.off.has(u.id),
                    };
                    if (!c) {
                        miss++;
                        r.bad = 1;
                        rows.push(r);
                        return;
                    }
                    if (seen.has(c)) {
                        dup++;
                        return;
                    }
                    seen.add(c);
                    rows.push(r);
                    if (!r.off) list.push(r);
                });
                const pe = msParse(MS.raw);
                let ign = 0;
                (wa ? pe.mob : pe.mail).forEach((c) => {
                    if (seen.has(c)) {
                        dup++;
                        return;
                    }
                    seen.add(c);
                    const u =
                        U.find((x) =>
                            wa
                                ? normMob(x.mobile) === c
                                : (x.email || "").toLowerCase() === c,
                        ) || null;
                    const r = {
                        u,
                        name: u ? u.name : "",
                        mobile: wa ? c : u ? u.mobile : "",
                        email: wa ? (u ? u.email : "") : c,
                        c,
                        isNew: !u,
                        extra: 1,
                    };
                    rows.push(r);
                    list.push(r);
                });
                ign = (wa ? pe.mail : pe.mob).length;
                return { list, rows, miss, dup, pe, ign };
            }
            const msText = (r) => {

            const dayKey = (d) => d.toISOString().slice(0, 10);
            function L7(lb, ser) {
                const W = 620,
                    H = 170,
                    p = 30,
                    mx = Math.max(1, ...ser.flatMap((s) => s.v)) * 1.1,
                    x = (i) =>
                        p + (i * (W - p - 8)) / Math.max(1, lb.length - 1),
                    y = (v) => H - 22 - (v / mx) * (H - 36);
                let g = [0, 0.5, 1]
                    .map(
                        (t) =>
                            `<line x1="${p}" x2="${W - 8}" y1="${y(mx * t)}" y2="${y(mx * t)}" stroke="var(--line)"/><text x="2" y="${y(mx * t) + 4}" font-size="10" fill="var(--mut)">${Math.round(mx * t)}</text>`,
                    )
                    .join("");
                ser.forEach(
                    (s) =>
                        (g += `<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.v.map((v, i) => x(i) + "," + y(v)).join(" ")}"/>`),
                );
                [0, lb.length >> 1, lb.length - 1].forEach(
                    (i) =>
                        (g += `<text x="${x(i)}" y="${H - 5}" font-size="10" fill="var(--mut)" text-anchor="middle">${lb[i]}</text>`),
                );
                return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div style="font-size:12px;color:var(--mut)">${ser.map((s) => `<span style="color:${s.c}">●</span> ${s.n}`).join(" &nbsp; ")}</div>`;
            }
            function B7(lb, v) {
                const W = 620,
                    H = 170,
                    p = 34,
                    mx = Math.max(1, ...v) * 1.1,
                    bw = (W - p - 8) / v.length;
                let g = v
                    .map((a, i) => {
                        const h = (a / mx) * (H - 36);
                        return `<rect x="${p + i * bw + 1}" y="${H - 22 - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2" fill="var(--ok)"/>`;

                return `<div class="card"><div class="em" style="padding:28px;text-align:center"><h3 style="margin:0 0 6px">No access to ${e2(nm)}</h3><p style="margin:0 0 12px">Your role (${e2(r ? r.name : "none")}) cannot open this page.<br>Ask an Owner to give you access under Access Control.</p>${f ? `<button class="btn p" data-go7="${e2(f)}">Go to ${e2(dn(f))}</button>` : ""}</div></div>`;

                        m.querySelectorAll(".dc[data-go7]").forEach((c) => {

                }
                restrict();

            /* ===== v10: only 3 roles (Owner, Manager, Support Executive) + client Plan is Owner-only ===== */
            (function () {
                const KEEP = ["owner", "manager", "support"];
                const MSG =
                    "Client Plan (financial data) is visible to Owner only";
                const planOK = () => actorIsOwner();
                function enforce() {
                    for (let i = ROLES.length - 1; i >= 0; i--)
                        if (!KEEP.includes(ROLES[i].id)) ROLES.splice(i, 1);
                    const d = {
                        manager:
                            "Runs day-to-day work. Can see and change everything except Team, Roles and the client Plan (financial data).",
                        support:
                            "Talks to customers, handles leads, quotes and sessions. Cannot see the client Plan (financial data).",
                        owner: "Full access to everything, including roles, team and the client Plan. Cannot be changed.",
                    };
                    ROLES.forEach((r) => {
                        if (d[r.id]) r.desc = d[r.id];
                    });
                    for (let i = TEAM.length - 1; i >= 0; i--)
                        if (!KEEP.includes(TEAM[i].role)) TEAM.splice(i, 1);
                    if (!TEAM.some((m) => m.role === "manager"))
                        TEAM.push({

                            added: "30 Oct 2026",

                    try {

                /* no new roles, no copies, no deletes */
                const noRole = () =>

                    planOK()

                              '<div class="em">' + MSG + ".</div>",

                const _ap = A.plan;
                A.plan = function (u) {
                    if (!planOK()) {
                        toast(MSG);
                        return;
                    }
                    return _ap(u);
                };
                /* Tools tab: hide calculator inputs and portfolio from non-owners */
                const _tl = TABS.Tools;
                TABS.Tools = (u) =>
                    planOK()
                        ? _tl(u)
                        : cd(
                              "Calculators used",
                              tb(
                                  ["Tool", "When"],
                                  (u.tools || []).map((t) => [t[0], t[1]]),
                                  "No tools used yet",

                /* Excel export: remove financial sheets and net-worth chart for non-owners */
                const PLAN_SHEETS = [
                    "Net worth",
                    "Income & expenses",
                    "Retirement plan",
                    "Goals & family",
                ];
                const _xl = xlsx;
                xlsx = function (name, sheets) {
                    if (!planOK() && Array.isArray(sheets)) {
                        sheets = sheets
                            .filter((s) => !PLAN_SHEETS.includes(s.name))
                            .map((s) =>
                                s.name === "Summary"
                                    ? Object.assign({}, s, { charts: [] })
                                    : s,
                            );
                    }
                    return _xl(name, sheets);
                };
                /* Audit trail: hide financial value changes from non-owners */
                const FIN =
                    /›\s*(ret|inc|exp|assets|liab|goals|fam|res2|port)\b/;
                function redacted(fn) {
                    if (planOK()) return fn();
                    const bak = AUDIT.map((a) => a.detail);
                    AUDIT.forEach((a) => {
                        if (a.detail)
                            a.detail = a.detail
                                .split("\n")
                                .map((l) =>
                                    FIN.test(l)
                                        ? "Client plan data changed (hidden, Owner only)"
                                        : l,
                                )
                                .join("\n");
                    });
                    try {
                        return fn();
                    } finally {
                        AUDIT.forEach((a, i) => {
                            a.detail = bak[i];
                        });
                    }
                }
                const _ga = G["Audit log"];
                G["Audit log"] = function () {
                    return redacted(() => _ga.apply(this, arguments));
                };
                const _xa = A.xla;
                A.xla = function () {
                    return redacted(() => _xa.apply(this, arguments));
                };
                /* hide Planner tab + buttons in the UI */
                const st = document.createElement("style");
                st.textContent =
                    "[data-a=rladd],[data-a=rldup],[data-a=rldel]{display:none!important}";
                document.head.appendChild(st);
                const _r10 = render;
                render = function () {
                    if (!planOK() && tab === "Planner") tab = "Profile";
                    _r10();
                    if (!planOK()) {
                        const m = $("m");
                        if (m)
                            m.querySelectorAll(
                                '.tabs button[data-t="Planner"],[data-a="plan"]',
                            ).forEach((b) => b.remove());
                    }
                };
            })();

            cur = "Home";

        </script>
